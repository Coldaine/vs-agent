policy_hints:
  - Prefer evolving 1-2 core weapons over filling every slot with weak weapons.
  - Passives that enable evolutions outrank random damage passives early.
  - Growth / Amount / Cooldown are generally high value when offered.
  - When boxed, survival > gem vacuum.
