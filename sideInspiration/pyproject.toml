[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-harness"
version = "0.1.0"
description = "Vampire Survivors leader-follower agent harness with SAM perception and pluggable movers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "scipy>=1.12",
]

[project.optional-dependencies]
sam = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
vs-harness = "vs_harness.cli:main"
vs-bakeoff = "vs_harness.bakeoff.runner:main"
vs-perc-bakeoff = "vs_harness.bakeoff.perception_runner:main"
vs-host-check = "vs_harness.host_check:main"
vs-vision-review = "vs_harness.vision_candidates:main"

[tool.setuptools.packages.find]
include = ["vs_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
