# spine/config.yaml — controller parameters (Loop C may mutate these)
tick_hz: 2
collision_radius_px: 90
staleness_ms: 800
dither_ms: 300
escape_vector_k: 5
gem_pull_weight: 0.3

# eval conditions (FIXED — never change and compare scores across)
stage: "Mad Forest"
character: "Antonio"
arcanas: false

# perception
level_up_ocr_trigger: "LEVEL UP"
death_ocr_triggers: ["YOU DIED", "GAME OVER"]
run_end_ocr_triggers: ["REAPER", "TIME'S UP"]
game_process_hint: "VampireSurvivors"
window_title_hint: "Vampire Survivors"
steam_app_id: "1794680"
capture_backend: wgc
input_backend: keyboard
gamepad_ready_timeout_s: 3.0
gamepad_create_retries: 3
gamepad_recreate_on_error: true
gamepad_button_hold_s: 0.3
# Character selection persists between attempts. Search is bounded and every
# move is OCR-checked before confirming the fixed Antonio evaluation choice.
character_search_directions: [up, left, right, down]
character_search_max_steps: 32
# Calibrated on the G0 fixed 2562x1472 capture: click the grid scrollbar top,
# then Antonio's card. The detail-panel OCR is the proof before confirmation.
character_scroll_top_frame: [1786, 355]
character_target_frame: [1137, 379]
character_selected_label_region: [720, 1200, 1800, 1470]
# Antonio card focus corners derived from paired native 2562x1472 captures.
character_target_rect: [1015, 308, 228, 237]
# The saved stage persists across attempts.  Search is bounded and every
# transition is OCR-checked before the run-start guard is allowed to confirm.
stage_search_directions: [up, down]
stage_search_max_steps: 32
# WGC frame coordinates on the physical left monitor (origin -2560, 0).
wgc_monitor_origin: [-2560, 0]
# DXCam output zero is the primary display. This game window runs on output 1.
capture_output_idx: 1
capture_min_dimensions: [640, 480]
capture_retries: 3
# G0 character-grid cursor changes affect a small fraction of the 2562x1472
# frame. Calibrated from the live 0.0051 mean pixel delta; retain margin while
# still requiring a visible screenshot change.
key_diff_threshold: 0.004
movement_diff_threshold: 0.1
tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"
menu_ocr_config: "--psm 6"

# detector (PROVISIONING — see status/HUMAN_NEEDED.md)
# Upstream monster_class.pt detects threats only; it does not label gems/elites.
yolo_weights: "spine/weights/monster_class.pt"
yolo_conf: 0.25
# map each model class NAME to a kind the reflex layer understands
yolo_class_map:
  monster: enemy

# OCR crop regions [x0, y0, x1, y1] in window pixels (resolution-specific,
# set once at fixed resolution). null = OCR whole frame / best-effort.
hud_regions:
  hp: null
  level: null
  timer: null
  level_up_options: null

# paths
episodes_dir: "episodes"
eval_set_dir: "eval_set"
failures_log: "failures.jsonl"
theories_log: "theories.jsonl"
experiments_log: "experiments.log"
